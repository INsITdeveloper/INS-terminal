name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (kosongkan untuk auto build-<run_number>)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (best effort)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" >/dev/null 2>&1 || true
          for pkg in "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "build-tools;36.1.0"; do
            echo "== mencoba $pkg =="
            sdkmanager "$pkg" >/dev/null 2>&1 && echo "OK $pkg" || echo "SKIP $pkg"
          done
          echo "--- SDK terpasang ---"
          sdkmanager --list_installed 2>/dev/null | head -40 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Prepare .env
        run: cp .env.example .env

      - name: Generate signing keystore
        run: |
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then STORE_PASS="ins-release-pass"; fi
          keytool -genkeypair -v -keystore my-upload-key.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=INS Terminal, OU=Release, O=INS, L=Jakarta, C=ID"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then export STORE_PASSWORD="ins-release-pass"; fi
          if [ -z "$KEY_PASSWORD" ]; then export KEY_PASSWORD="ins-release-pass"; fi
          gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK" || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ins-terminal-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Determine release tag
        id: rel
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: INS Terminal ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
